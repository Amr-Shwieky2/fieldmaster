services:
  postgres:
    image: ghcr.io/baosystems/postgis:17-3.5
    container_name: fieldmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldmaster
      POSTGRES_PASSWORD: fieldmaster_dev_password
      POSTGRES_DB: fieldmaster
    ports:
      - "5433:5432"
    volumes:
      - fieldmaster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldmaster -d fieldmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fieldmaster-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fieldmaster_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fieldmaster-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fieldmaster
      MINIO_ROOT_PASSWORD: fieldmaster_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fieldmaster_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldmaster_postgres_data:
  fieldmaster_redis_data:
  fieldmaster_minio_data:
