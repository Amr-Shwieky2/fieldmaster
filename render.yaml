# Render Blueprint for the FieldMaster API.
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file
# and creates the service below. Secrets (anything with `sync: false`) are
# NOT stored here -- set their real values once in the Render dashboard
# after the first deploy (Service -> Environment).
#
# Free tier notes: Render's free web services spin down after 15 minutes of
# inactivity and take ~30-60s to wake up on the next request. 750 free
# instance-hours/month. See docs/deployment-free-tier.md for the full setup
# walkthrough (Supabase for Postgres+PostGIS, Upstash for Redis, Twilio for SMS).

services:
  - type: web
    name: fieldmaster-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1

      # --- Database (Supabase Postgres + PostGIS) ---
      - key: DATABASE_URL
        sync: false

      # --- Redis / BullMQ (Upstash) ---
      - key: REDIS_URL
        sync: false

      # --- Auth ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: OTP_TTL_SECONDS
        value: 300
      - key: OTP_MAX_ATTEMPTS
        value: 5

      # --- Application-layer encryption (bank accounts / identity documents) ---
      - key: LOCAL_ENCRYPTION_KEY_BASE64
        generateValue: true

      # --- SMS / OTP delivery (Twilio) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

      # --- Object storage (Supabase Storage, S3-compatible) ---
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: fieldmaster-files
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: true

      # --- CORS: the admin-web (Vercel) and mobile (Expo) origins ---
      - key: CORS_ORIGINS
        sync: false

      # --- Optional, leave unset to use dev/no-op adapters ---
      - key: FIREBASE_PROJECT_ID
        value: ""
      - key: FIREBASE_CLIENT_EMAIL
        value: ""
      - key: FIREBASE_PRIVATE_KEY
        value: ""
      - key: GOOGLE_MAPS_API_KEY
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: LOG_LEVEL
        value: info
